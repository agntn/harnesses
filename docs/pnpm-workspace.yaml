packages:
  - .

# Without it Node walks up to the root node_modules and the server bundle can carry a second Vue.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "wrangler@4.134.0"
  - miniflare@5.20260917.0-alpha
