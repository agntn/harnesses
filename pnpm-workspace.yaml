packages:
  - docs

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - "@oh-my-pi/omptype@18.2.5"
  - "@oh-my-pi/pi-ai@18.2.5"
  - "@oh-my-pi/pi-coding-agent@18.2.5"
  - "oxlint-tsgolint@7.0.2002"
  - "@oh-my-pi/omp-stats@18.2.5"
  - "@oh-my-pi/pi-agent-core@18.2.5"
  - "@oh-my-pi/pi-catalog@18.2.5"
  - "@oh-my-pi/pi-mnemopi@18.2.5"
  - "@oh-my-pi/pi-natives-darwin-arm64@18.2.5"
  - "@oh-my-pi/pi-natives-darwin-x64@18.2.5"
  - "@oh-my-pi/pi-natives-linux-arm64@18.2.5"
  - "@oh-my-pi/pi-natives-linux-x64@18.2.5"
  - "@oh-my-pi/pi-natives-win32-arm64@18.2.5"
  - "@oh-my-pi/pi-natives-win32-x64@18.2.5"
  - "@oh-my-pi/pi-natives@18.2.5"
  - "@oh-my-pi/pi-tui@18.2.5"
  - "@oh-my-pi/pi-utils@18.2.5"
  - "@oh-my-pi/pi-wire@18.2.5"
  - "@oh-my-pi/snapcompact@18.2.5"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2002"
  - "@oxlint-tsgolint/darwin-x64@7.0.2002"
  - "@oxlint-tsgolint/linux-arm64@7.0.2002"
  - "@oxlint-tsgolint/linux-x64@7.0.2002"
  - "@oxlint-tsgolint/win32-arm64@7.0.2002"
  - "@oxlint-tsgolint/win32-x64@7.0.2002"
  - "@earendil-works/chord@0.99.1"
  - "@earendil-works/pi-ai@0.99.1"
  - "@earendil-works/pi-codemode@0.99.1"
  - "@earendil-works/pi-coding-agent@0.99.1"
  - "@earendil-works/pi-mcp@0.99.1"
  - "@earendil-works/pi-telemetry@0.99.1"
  - "@earendil-works/pi-tui@0.99.1"
  - "wrangler@4.134.0"
  - miniflare@5.20260917.0-alpha
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# One version per name for the library and docs/, so a bump moves both in one line.
catalogs:
  deps:
    "@modelcontextprotocol/sdk": 1.30.1
    "@toon-format/toon": 4.1.1
    better-sqlite3: 12.11.1
    citty: 0.2.2
    consola: 3.4.2
    docus: 5.13.0
    nuxt: 4.5.2
    smol-toml: 1.8.0
    ufo: 1.6.4
    yaml: 2.9.1
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 0.99.1
    "@earendil-works/pi-tui": 0.99.1
    "@iconify-json/lucide": 1.2.147
    "@iconify-json/simple-icons": 1.2.100
    "@iconify-json/vscode-icons": 1.2.92
    "@nuxt/content": 3.16.0
    "@nuxt/ui": 4.11.0
    "@oh-my-pi/omptype": 18.13.2
    "@oh-my-pi/pi-ai": 18.13.2
    "@oh-my-pi/pi-coding-agent": 18.13.2
    "@vueuse/core": 14.4.0
    changelogen: 0.6.2
    obuild: 0.4.43
    shiki: 4.4.3
    typebox: 1.3.34
    typescript: 6.0.3
    wrangler: 4.134.0

cleanupUnusedCatalogs: true
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
